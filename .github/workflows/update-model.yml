name: Update F1 prediction model

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: write

jobs:
  update-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: python -m pip install -r requirements-ml.txt
      - run: python scripts/update_model.py
      - name: Commit a newly evolved artifact
        run: |
          if git diff --quiet -- model/race-winner-v3.json; then
            echo "No newly completed race; model is unchanged."
            exit 0
          fi
          git config user.name "apex-f1-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add model/race-winner-v3.json
          git commit -m "Update F1 model with latest completed races"
          git push
